name: Validate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Validate plugin manifest
        run: |
          set -euo pipefail
          git clone --depth 1 --branch quattro https://github.com/omacom/omarchy.git /tmp/omarchy
          bash /tmp/omarchy/bin/omarchy-plugin-validate "$GITHUB_WORKSPACE"
